<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Live Q&A — Presentation</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />

    <style>
      /* =====================================
         FIXED HEADER
      ===================================== */

      #page-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;

        background: var(--pico-background-color);
        border-bottom: 1px solid var(--pico-muted-border-color);
      }

      #page-header-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      #page-header h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      #page-header p {
        margin: 0.25rem 0 0;
        font-size: 0.9rem;
        color: var(--pico-muted-color);
      }

      #header-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      #header-actions button {
        width: auto;
        margin: 0;
      }

      /* =====================================
         MAIN CONTENT
      ===================================== */

      main.container {
        max-width: 1200px;

        padding-top: 8.5rem;
        padding-bottom: 10rem;
      }

      /* =====================================
         QUESTION CARD
      ===================================== */

      #questions article {
        padding: 1.5rem;
        margin-bottom: 1.5rem;

        border-radius: var(--pico-border-radius);
      }

      /* Original question:
         smaller and less dominant */

      #questions article h3 {
        font-size: clamp(1.4rem, 2.5vw, 1.8rem);
        line-height: 1.5;
        font-weight: 600;
        margin-bottom: 1.25rem;
      }

      /* Translation:
         more prominent than the original */

      #questions article > p {
        font-size: clamp(1rem, 1.8vw, 1.3rem);
        line-height: 1.7;
        font-weight: 400;
        margin-top: 0;
        margin-bottom: 0;
        color: var(--pico-color);
      }

      /* Presentation mode card */

      .presentation-card {
        padding: 2rem;
        min-height: 250px;
      }

      /* Original question during presentation */

      .presentation-card h3 {
        font-size: clamp(1.2rem, 2.2vw, 1.7rem);
        line-height: 1.5;

        font-weight: 500;

        margin-bottom: 1.5rem;
      }

      /* Translation during presentation */

      .presentation-card > p {
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        line-height: 1.7;

        font-weight: 600;
      }

      /* =====================================
         FIXED PRESENTATION CONTROLS
      ===================================== */

      #presentation-controls {
        display: none;

        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;

        z-index: 100;

        background: var(--pico-background-color);
        border-top: 1px solid var(--pico-muted-border-color);

        padding: 1rem;
        margin: 0;
      }

      #presentation-controls-inner {
        max-width: 1200px;
        margin: 0 auto;
      }

      #presentation-counter {
        text-align: center;

        font-size: 0.9rem;
        color: var(--pico-muted-color);

        margin-bottom: 1rem;
      }

      #presentation-controls button {
        width: auto;
        margin-bottom: 0;
      }

      /* =====================================
         MOBILE
      ===================================== */

      @media (max-width: 600px) {
        #page-header-inner {
          padding: 0.75rem;
          gap: 0.5rem;
        }

        #page-header h1 {
          font-size: 1.2rem;
        }

        #page-header p {
          font-size: 0.75rem;
        }

        #header-actions button {
          font-size: 0.8rem;
          padding: 0.5rem 0.75rem;
        }

        main.container {
          padding-top: 7rem;
          padding-bottom: 9rem;
        }

        #questions article {
          padding: 1rem;
        }

        .presentation-card {
          padding: 1.25rem;
        }

        #presentation-controls {
          padding: 0.75rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================
         FIXED HEADER
    ===================================== -->

    <header id="page-header">
      <div id="page-header-inner">
        <div>
          <h1>Live Q&A</h1>
          <p>Submitted questions</p>
        </div>

        <div id="header-actions">
          <a
            href="/presentation/reset"
            role="button"
            class="outline secondary"
            id="back-to-qr"
          >
            QR Code
          </a>
          <button
            type="button"
            id="start-presentation"
            onclick="startPresentation()"
          >
            Start presentation
          </button>

          <button
            type="button"
            id="exit-presentation"
            class="outline secondary"
            onclick="exitPresentation()"
            style="display: none"
          >
            Exit presentation
          </button>
        </div>
      </div>
    </header>

    <!-- =====================================
         QUESTIONS
    ===================================== -->

    <main class="container">
      <section id="questions">{% include "_question_list.html" %}</section>
    </main>

    <!-- =====================================
         FIXED PRESENTATION NAVIGATION
    ===================================== -->

    <footer id="presentation-controls">
      <div id="presentation-controls-inner">
        <p id="presentation-counter"></p>

        <div style="display: flex; justify-content: space-between; gap: 1rem">
          <button
            type="button"
            class="secondary"
            id="previous-question"
            onclick="previousQuestion()"
          >
            ← Previous
          </button>

          <button type="button" id="next-question" onclick="nextQuestion()">
            Next question →
          </button>
        </div>
      </div>
    </footer>

    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script>
      let presentationActive = false;
      let currentQuestionIndex = 0;

      let refreshInterval = null;
      let refreshController = null;

      /* =====================================
         GET QUESTIONS
      ===================================== */

      function getQuestions() {
        return Array.from(document.querySelectorAll("#questions article"));
      }

      /* =====================================
         AUTOMATIC REFRESH
      ===================================== */

      async function refreshQuestions() {
        if (presentationActive || refreshController) {
          return;
        }

        const controller = new AbortController();

        refreshController = controller;

        try {
          const response = await fetch("/presentation/questions", {
            signal: controller.signal,
            headers: {
              "HX-Request": "true",
            },
          });

          if (!response.ok) {
            throw new Error("Unable to refresh questions");
          }

          const html = await response.text();

          // Do not replace questions during presentation.
          if (presentationActive) {
            return;
          }

          document.getElementById("questions").innerHTML = html;
        } catch (error) {
          if (error.name !== "AbortError") {
            console.error("Question refresh error:", error);
          }
        } finally {
          if (refreshController === controller) {
            refreshController = null;
          }
        }
      }

      /* =====================================
         START AUTOMATIC REFRESH
      ===================================== */

      function startAutomaticRefresh() {
        if (refreshInterval) {
          clearInterval(refreshInterval);
        }

        refreshInterval = setInterval(refreshQuestions, 3000);
      }

      /* =====================================
         STOP AUTOMATIC REFRESH
      ===================================== */

      function stopAutomaticRefresh() {
        if (refreshInterval) {
          clearInterval(refreshInterval);
          refreshInterval = null;
        }

        // Cancel any refresh already in progress.
        if (refreshController) {
          refreshController.abort();
          refreshController = null;
        }
      }

      /* =====================================
         START PRESENTATION
      ===================================== */

      function startPresentation() {
        const questions = getQuestions();

        if (questions.length === 0) {
          alert("No questions available yet.");
          return;
        }

        stopAutomaticRefresh();

        presentationActive = true;
        currentQuestionIndex = 0;

        document.getElementById("start-presentation").style.display = "none";
        document.getElementById("back-to-qr").style.display = "none";

        document.getElementById("exit-presentation").style.display = "block";

        document.getElementById("presentation-controls").style.display =
          "block";

        updatePresentation();
      }

      /* =====================================
         UPDATE PRESENTATION
      ===================================== */

      function updatePresentation() {
        const questions = getQuestions();

        if (questions.length === 0) {
          exitPresentation();
          return;
        }

        if (currentQuestionIndex >= questions.length) {
          currentQuestionIndex = questions.length - 1;
        }

        questions.forEach((question, index) => {
          question.style.display =
            index === currentQuestionIndex ? "block" : "none";

          question.classList.toggle(
            "presentation-card",
            index === currentQuestionIndex,
          );
        });

        document.getElementById("presentation-counter").textContent =
          `Question ${currentQuestionIndex + 1} of ${questions.length}`;

        document.getElementById("previous-question").disabled =
          currentQuestionIndex === 0;

        document.getElementById("next-question").disabled =
          currentQuestionIndex === questions.length - 1;
      }

      /* =====================================
         NEXT QUESTION
      ===================================== */

      function nextQuestion() {
        if (currentQuestionIndex < getQuestions().length - 1) {
          currentQuestionIndex++;

          updatePresentation();
        }
      }

      /* =====================================
         PREVIOUS QUESTION
      ===================================== */

      function previousQuestion() {
        if (currentQuestionIndex > 0) {
          currentQuestionIndex--;

          updatePresentation();
        }
      }

      /* =====================================
         EXIT PRESENTATION
      ===================================== */

      function exitPresentation() {
        presentationActive = false;
        currentQuestionIndex = 0;

        getQuestions().forEach((question) => {
          question.style.display = "";

          question.classList.remove("presentation-card");
        });

        document.getElementById("presentation-controls").style.display = "none";
        document.getElementById("back-to-qr").style.display = "";

        document.getElementById("start-presentation").style.display = "block";

        document.getElementById("exit-presentation").style.display = "none";

        // Resume automatic refresh.
        startAutomaticRefresh();
      }

      /* =====================================
         INITIALIZE
      ===================================== */

      startAutomaticRefresh();
    </script>
  </body>
</html>
